name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extension tests
        run: node test.js
      - name: Build the app
        run: sh build.sh
      - name: Package the download
        run: sh package.sh
