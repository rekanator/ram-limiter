name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extension tests
        run: node test.js
      - name: Build the app
        run: sh build.sh
      - name: Package the download
        run: sh package.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extension tests
        run: node test.js
      - name: Build and package the Windows app
        run: windows\package.cmd
        shell: cmd
      - name: Keep the Windows download
        uses: actions/upload-artifact@v4
        with:
          name: windows-download
          path: dist/RAM-Limiter-*-Windows.zip
          if-no-files-found: error
